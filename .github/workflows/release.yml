name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  verify-tag-on-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Ensure tag points at a commit on main
        run: |
          git fetch origin main --depth=1
          if ! git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
            echo "::error::Tag ${{ github.ref_name }} does not point to a commit on main; refusing to release." >&2
            exit 1
          fi

  build-and-test:
    needs: verify-tag-on-main
    uses: ./.github/workflows/ci.yml

  version:
    needs: build-and-test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      major: ${{ steps.version.outputs.major }}
      major_minor: ${{ steps.version.outputs.major_minor }}
    steps:
      - name: Extract version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "version=${version}"
            echo "major=${version%%.*}"
            echo "major_minor=${version%.*}"
          } >> "$GITHUB_OUTPUT"

  docker-publish:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push container image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/EasyAuthSimulator/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ needs.version.outputs.version }}
            ${{ steps.image.outputs.name }}:${{ needs.version.outputs.major_minor }}
            ${{ steps.image.outputs.name }}:${{ needs.version.outputs.major }}
            ${{ steps.image.outputs.name }}:latest

  nuget-publish:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Pack
        run: |
          dotnet pack src/EasyAuthSimulator.Hosting/EasyAuthSimulator.Hosting.csproj \
            --configuration Release \
            -p:Version=${{ needs.version.outputs.version }} \
            -o nupkgs

      - name: Add GitHub Packages NuGet source
        run: |
          dotnet nuget add source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --name github \
            --username "${{ github.actor }}" \
            --password "${{ secrets.GITHUB_TOKEN }}" \
            --store-password-in-clear-text

      - name: Push
        run: dotnet nuget push "nupkgs/*.nupkg" --source github --api-key "${{ secrets.GITHUB_TOKEN }}"

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          path: nupkgs/*.nupkg

  github-release:
    needs: [docker-publish, nuget-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download package artifact
        uses: actions/download-artifact@v8
        with:
          name: nuget-package
          path: nupkgs

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: nupkgs/*.nupkg
